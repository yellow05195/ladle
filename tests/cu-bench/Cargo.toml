# Compute-unit benchmark and end-to-end check of the SBF build of the Ladle
# program (target/deploy/ladle.so) on LiteSVM. Not part of the program
# workspace: its own [workspace] and Cargo.lock keep the SVM dependencies
# away from the program's dependency graph.
#
#   cargo run --release -- [path/to/ladle.so] [index|owner]
[package]
name = "ladle-cu-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
litesvm = "=0.18.1"
solana-address = { version = "~2.7", features = ["curve25519", "decode"] }
solana-account = "4.3"
solana-instruction = "~3.5"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-message = "4.2.4"
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }
# the Clock sysvar (the shutdown notice runs on the cluster clock)
solana-clock = "~3.2.0"

[profile.release]
opt-level = 3
debug = false

[workspace]
members = ["programs/ladle"]
# tests/cu-bench is its own workspace (LiteSVM dependencies stay out of the
# program's dependency graph).
exclude = ["tests/cu-bench"]
resolver = "2"

[profile.release]
# Deploy cost is rent on the .so size: optimise for size. Measured on the
# same source (docs/DEPLOY.md): opt-level 3 = 535,376 B, "s" = 447,416 B,
# "z" = 410,488 B; "z" costs ~25-40 % more compute units, every
# instruction stays far below the 1.4M limit (tests/cu-bench).
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
